[plugin]

name="dot-entity"
description="The id space every world object shares: an allocator that hands out entity ids carrying their own kind, a record kept beside the node rather than on it, and the two reverse indexes (node and the game's own key) that every game was maintaining by hand. Replaces the four incompatible schemes the games invented for dot-combat. Depends on dot-core."
author="dot"
version="0.1.0"
script="dot_entity_plugin.gd"
